# Renawi Motors web container (nginx): serves the Vite build of apps/web and proxies /api/ to
# the API container. Installed as /etc/nginx/conf.d/default.conf by apps/web/Dockerfile.
# TLS is terminated by Caddy in front of this container (deploy/Caddyfile); the local rehearsal
# (deploy/docker-compose.local-test.yml) talks to it directly over plain HTTP.

# Client address from Caddy's X-Forwarded-For (Docker networks are private ranges).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Forwarded headers for the API: keep what Caddy sent, otherwise describe this hop.
map $http_x_forwarded_proto $renawi_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $renawi_forwarded_host {
    default $http_x_forwarded_host;
    ''      $host;
}
map $http_x_forwarded_for $renawi_forwarded_for {
    default "$http_x_forwarded_for, $realip_remote_addr";
    ''      $remote_addr;
}
# API responses without their own Cache-Control are never stored by browsers or proxies
# (they contain personal data); file downloads that set one keep it.
map $upstream_http_cache_control $renawi_api_cache_control {
    default $upstream_http_cache_control;
    ''      "no-store";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf font/otf;

    # Content-Security-Policy of the app. Ant Design injects <style> elements and charts use
    # style attributes ('unsafe-inline' for styles only); fonts and small images may be data:
    # URLs; uploaded images are previewed from blob: URLs. No inline or third-party scripts.
    set $renawi_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Liveness of this container (compose healthcheck); not proxied.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ----------------------------------------------------------------------------------
    location /api/ {
        # Resolve the `api` service at request time (Docker DNS), so a recreated API container
        # with a new IP address is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $renawi_api http://api:3000;
        proxy_pass $renawi_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $renawi_forwarded_for;
        proxy_set_header X-Forwarded-Proto $renawi_forwarded_proto;
        proxy_set_header X-Forwarded-Host $renawi_forwarded_host;

        # Uploads up to the API limit (MAX_UPLOAD_MB=20) plus multipart overhead; PDF renders
        # can take up to PDF_TIMEOUT_MS (60 s) when Chromium starts cold.
        client_max_body_size 25m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $renawi_api_cache_control always;
        # API responses (JSON, PDFs, uploaded files opened in a tab) only need framing denied;
        # the page CSP would get in the way of Swagger UI and the browser PDF viewer.
        set $renawi_csp "frame-ancestors 'none'";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- Web app --------------------------------------------------------------------------------
    # Hashed build output (file names change on every build): cache for a year. A missing asset
    # is a 404, never the HTML page.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Workbox runtime (hashed name) next to the service worker.
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Entry HTML, service worker, its registration script and the web manifest: always
    # revalidate, so a deploy reaches every browser and installed PWA.
    location ~ ^/(index\.html|sw\.js|registerSW\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        # Not in nginx's mime.types.
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Dotfiles are never served.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Everything else: static files (favicon, icons) with a short cache, and the SPA fallback
    # for client-side routes such as /vehicles/123 (served as /index.html, no-cache above).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
