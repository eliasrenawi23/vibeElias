# Security headers for every response (included by each location of deploy/nginx.conf, because
# an add_header inside a location replaces all add_header directives inherited from the server).
# The location sets $renawi_csp. HSTS is added by Caddy, which terminates HTTPS.
add_header Content-Security-Policy $renawi_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
