# Local development services.
#   docker compose up -d postgres          -> PostgreSQL 17 on localhost:5432 (databases renawi + renawi_test)
#   docker compose --profile tools up -d   -> additionally pgAdmin on http://localhost:5050
name: renawi-motors

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renawi
      POSTGRES_PASSWORD: renawi
      POSTGRES_DB: renawi
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port; set POSTGRES_PORT in .env if 5432 is taken (e.g. by a local PostgreSQL service).
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only when the data volume is created for the first time.
      - ./deploy/db/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renawi -d renawi']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pgAdmin rejects special-use domains such as .local, hence example.com.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: renawi
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./deploy/db/pgadmin-servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin:
