# Continuous integration: every pull request and every push to main.
# Deploy is a separate, manually started workflow (.github/workflows/deploy.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build @renawi/shared and generate the Prisma client
        run: |
          npm run build -w packages/shared
          npm exec -w apps/api -- prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (shared, api, web)
        run: npm test
      - name: Build API and web
        run: |
          npm run build -w apps/api
          npm run build -w apps/web

  api-e2e:
    name: API end-to-end tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: renawi
          POSTGRES_PASSWORD: renawi
          POSTGRES_DB: renawi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renawi -d renawi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suites only touch TEST_DATABASE_URL (they refuse a database without "test" in its
      # name); DATABASE_URL just has to differ.
      DATABASE_URL: postgresql://renawi:renawi@localhost:5432/renawi?schema=public
      TEST_DATABASE_URL: postgresql://renawi:renawi@localhost:5432/renawi_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build @renawi/shared and generate the Prisma client
        run: |
          npm run build -w packages/shared
          npm exec -w apps/api -- prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium + system libraries for the PDF end-to-end tests (the API's Playwright version).
      - name: Install Chromium
        run: npm exec -w apps/api -- playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm exec -w apps/api -- jest --config ./test/jest-e2e.json --runInBand

  web-e2e:
    name: Playwright UI tests
    # Slower browser flows: main only (they mock the API, so no database is needed).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build @renawi/shared
        run: npm run build -w packages/shared
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npm exec -w apps/web -- playwright install --with-deps chromium
      - name: UI tests
        run: npm run test:ui -w apps/web
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  deploy-files:
    name: Deployment files (compose, shell scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose files with the example environment
        run: |
          cp .env.production.example /tmp/prod.env
          docker compose --env-file /tmp/prod.env -f docker-compose.prod.yml config --quiet
          docker compose --env-file /tmp/prod.env -f docker-compose.prod.yml \
            -f docker-compose.build.yml config --quiet
          docker compose --env-file /tmp/prod.env -f docker-compose.prod.yml \
            -f docker-compose.build.yml -f deploy/docker-compose.local-test.yml config --quiet
      - name: ShellCheck
        run: shellcheck -x deploy/*.sh deploy/backup/*.sh
